[pytest]
# Carpeta donde pytest busca las pruebas.
testpaths = tests

# La raíz del proyecto se agrega al sys.path para poder importar
# `shopgo` y `pages` desde las pruebas sin instalar el proyecto.
pythonpath = .

# -ra: al final muestra un resumen de pruebas saltadas, fallidas, etc.
addopts = -ra

# Marcadores registrados (pytest advierte si se usa uno no declarado).
markers =
    ui: pruebas de UI móvil que requieren un servidor Appium y un dispositivo (se ejecutan con --run-ui)
